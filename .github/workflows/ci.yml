name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Determine the changeset size and set the corresponding distribute-on value
      - run: |
          # Placeholder logic for determining changeset size
          # Replace with your actual logic to determine the size
          export DISTRIBUTE_ON="3 linux-medium-js"
          if [ "$CHANGES_SIZE" = "medium" ]; then
            export DISTRIBUTE_ON="6 linux-medium-js"
          elif [ "$CHANGES_SIZE" = "large" ]; then
            export DISTRIBUTE_ON="10 linux-medium-js"
          fi
          echo "DISTRIBUTE_ON=$DISTRIBUTE_ON" >> $GITHUB_ENV

      # Start Nx Cloud CI run with the determined distribute-on value
      - run: npx nx-cloud start-ci-run --distribute-on="${{ env.DISTRIBUTE_ON }}" --stop-agents-after="build"

      # Cache node_modules
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci --legacy-peer-deps
      - uses: nrwl/nx-set-shas@v4

      # Run affected tasks
      - run: npx nx affected -t lint test build
