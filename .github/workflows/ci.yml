name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Ensure the full history is available for Nx

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'  # Caching node_modules to speed up installation

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps  # Use npm ci for a clean install

      - name: Start Nx Cloud CI Run
        run: npx nx-cloud start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="build"
        # Enables task distribution via Nx Cloud

      - name: Record Nx Affected Tasks
        run: npx nx-cloud record -- npx nx affected -t lint test build
        # Records logs to Nx Cloud for lint, test, and build tasks

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v4
        # Ensure Nx SHA references are up-to-date

      - name: Run Nx Affected
        run: npx nx affected -t lint test build
        # Runs lint, test, and build only for affected projects
