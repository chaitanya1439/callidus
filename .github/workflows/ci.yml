name: CI

on:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Ensure the full history is available for Nx

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'  # Caching node_modules to speed up installation

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps  # Use npm ci for a clean install

      
